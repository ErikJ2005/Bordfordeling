<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bordfordeling</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css" />
  </head>
  <body>
    <!--
      Hele appen kjører i nettleseren (Python via Pyodide/stlite).
      Navnelister som lastes opp sendes aldri til noen server og lagres ikke.
    -->
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";
      mount(
        {
          requirements: ["openpyxl"],
          entrypoint: "Bord.py",
          files: {
            "Bord.py": { url: "./Bord.py" },
            "fordeling.py": { url: "./fordeling.py" },
          },
          streamlitConfig: {
            "browser.gatherUsageStats": false,
            "client.toolbarMode": "minimal",
          },
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
